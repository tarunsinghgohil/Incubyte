services:
  - type: web
    name: acme-compensation-hub
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: acme-compensation-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/acme.db
      - key: DEMO_USERNAME
        sync: false
      - key: DEMO_PASSWORD
        sync: false
